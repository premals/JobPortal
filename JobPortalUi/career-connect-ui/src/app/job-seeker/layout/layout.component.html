<nav class="seeker-nav">
  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <span class="brand-title">Career Connect</span>
      <span class="brand-subtitle">Job Seeker</span>
    </div>
  </div>

  <div class="nav-links">
    <a routerLink="/job-seeker" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
    <a routerLink="/job-seeker/jobs" routerLinkActive="active">Jobs</a>
    <a routerLink="/job-seeker/applications" routerLinkActive="active">Applications</a>
    <a routerLink="/job-seeker/resume" routerLinkActive="active">AI Resume</a>
  </div>

  <div class="nav-actions">
    <button class="notification-btn" (click)="toggleNotifications()">
      <i class="bi bi-bell"></i>
      <span class="badge" *ngIf="unreadNotifications > 0">{{ unreadNotifications }}</span>
    </button>
    <button class="profile-btn" routerLink="/profile">Profile</button>
  </div>
</nav>

<div class="page-shell">
  <router-outlet></router-outlet>
</div>

<app-notification-panel
  *ngIf="showNotifications"
  (closed)="showNotifications = false">
</app-notification-panel>
