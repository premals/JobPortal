<div class="container mt-5">
  <div class="card mx-auto" style="max-width: 600px;">
    <div class="card-body">

      <h3 class="card-title mb-4">Edit Profile</h3>

      <form *ngIf="!isLoading"
            [formGroup]="profileForm"
            (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text"
                 class="form-control"
                 formControlName="fullName">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email"
                 class="form-control"
                 formControlName="email">
        </div>

        <div class="mb-4">
          <label class="form-label">User Type</label>
          <input type="text"
                 class="form-control"
                 formControlName="userType">
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-success w-50" type="submit">
            Save
          </button>
          <button class="btn btn-secondary w-50"
                  type="button"
                  (click)="cancel()">
            Cancel
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
