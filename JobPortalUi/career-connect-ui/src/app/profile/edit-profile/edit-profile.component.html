<div class="edit-page">
  <div class="edit-hero">
    <div>
      <span class="eyebrow">Edit Profile</span>
      <h2>Keep Your Details Fresh</h2>
      <p>Update your profile and make a stronger impression.</p>
    </div>
    <div class="hero-actions">
      <button class="btn btn-outline-light" (click)="cancel()">
        {{ embedded ? 'Close' : 'Back' }}
      </button>
    </div>
  </div>

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="!isLoading">
    <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

    <section class="edit-card" *ngIf="userType === 'JobProvider'">
      <h4>Recruiter Profile</h4>
      <p class="muted">Manage the people and brand profile your candidates see.</p>

      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input class="form-control" [(ngModel)]="profile.fullName" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" [value]="profile.email" disabled />
        </div>
      </div>

      <div class="divider"></div>

      <div class="form-row">
        <div class="form-group">
          <label>Company Name</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.companyName" />
        </div>
        <div class="form-group">
          <label>Brand Name</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.brandName" />
        </div>
        <div class="form-group">
          <label>Industry</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.industry" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Company Size</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.companySize" />
        </div>
        <div class="form-group">
          <label>Website</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.website" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.phone" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Location</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.location" />
        </div>
        <div class="form-group">
          <label>Logo URL</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.logoUrl" />
        </div>
        <div class="form-group">
          <label>LinkedIn</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.linkedInUrl" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Twitter</label>
          <input class="form-control" [(ngModel)]="jobProviderProfile.twitterUrl" />
        </div>
      </div>

      <div class="form-group">
        <label>Company Story</label>
        <textarea class="form-control" rows="4" [(ngModel)]="jobProviderProfile.about"></textarea>
      </div>

      <button class="btn btn-primary" (click)="saveJobProvider()" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save Changes' }}
      </button>
    </section>

    <section class="edit-card" *ngIf="userType === 'JobSeeker'">
      <h4>Job Seeker Profile</h4>
      <p class="muted">Keep your basic contact details up to date.</p>

      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input
            class="form-control"
            name="jobSeekerFullName"
            required
            [(ngModel)]="jobSeekerProfile.fullName"
            #jobSeekerFullName="ngModel"
            [class.is-invalid]="jobSeekerFullName.invalid && (jobSeekerFullName.touched || jobSeekerSubmitAttempted)" />
          <p class="field-error" *ngIf="jobSeekerFullName.invalid && (jobSeekerFullName.touched || jobSeekerSubmitAttempted)">
            Full name is required
          </p>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input
            class="form-control"
            name="jobSeekerEmail"
            [(ngModel)]="jobSeekerProfile.email"
            disabled />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input
            class="form-control"
            name="jobSeekerPhone"
            [(ngModel)]="jobSeekerProfile.phone" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Gender</label>
          <input
            class="form-control"
            name="jobSeekerGender"
            [(ngModel)]="jobSeekerProfile.gender" />
        </div>
      </div>

      <button class="btn btn-primary" (click)="saveJobSeeker()" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save Profile' }}
      </button>
    </section>
  </div>
</div>
