<!-- BACKDROP -->
<div class="modal-backdrop-custom" (click)="close()"></div>

<!-- MODAL -->
<div class="create-job-modal" (click)="$event.stopPropagation()">

  <!-- HEADER -->
  <div class="modal-header d-flex align-items-center justify-content-between">
    <h5 class="mb-0">
      <i class="bi bi-briefcase-fill me-2"></i>
      Create New Job
    </h5>
    <button type="button" class="close-btn" (click)="close()">✕</button>
  </div>

  <!-- BODY -->
  <div class="modal-body">

    <!-- STEP INDICATOR -->
    <ul class="nav nav-pills justify-content-center mb-4">
      <li class="nav-item">
        <span class="nav-link" [class.active]="step === 1">Basic Info</span>
      </li>
      <li class="nav-item">
        <span class="nav-link" [class.active]="step === 2">Details</span>
      </li>
      <li class="nav-item">
        <span class="nav-link" [class.active]="step === 3">Salary & Meta</span>
      </li>
    </ul>

    <form [formGroup]="jobForm" novalidate>

      <!-- STEP 1 -->
      <div *ngIf="step === 1">

        <div class="mb-3">
          <label class="form-label">Job Title</label>
          <input
            type="text"
            class="form-control"
            formControlName="title"
            [class.is-invalid]="isFieldInvalid('title')">
          <p class="field-error" *ngIf="getFieldError('title', 'Job title') as error">{{ error }}</p>
        </div>

        <div class="mb-3">
          <label class="form-label">Job Description</label>
          <textarea
            class="form-control"
            rows="5"
            formControlName="description"
            [class.is-invalid]="isFieldInvalid('description')"></textarea>
          <p class="field-error" *ngIf="getFieldError('description', 'Job description') as error">{{ error }}</p>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Employment Type</label>
            <select
              class="form-select"
              formControlName="employmentType"
              [class.is-invalid]="isFieldInvalid('employmentType')">
              <option value="FullTime">Full Time</option>
              <option value="PartTime">Part Time</option>
              <option value="Contract">Contract</option>
            </select>
            <p class="field-error" *ngIf="getFieldError('employmentType', 'Employment type') as error">{{ error }}</p>
          </div>

          <div class="col-md-6">
            <label class="form-label">Work Mode</label>
            <select
              class="form-select"
              formControlName="workMode"
              [class.is-invalid]="isFieldInvalid('workMode')">
              <option value="Onsite">Onsite</option>
              <option value="Remote">Remote</option>
              <option value="Hybrid">Hybrid</option>
            </select>
            <p class="field-error" *ngIf="getFieldError('workMode', 'Work mode') as error">{{ error }}</p>
          </div>
        </div>

      </div>

      <!-- STEP 2 -->
      <div *ngIf="step === 2" class="pb-3">

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Min Experience (Years)</label>
            <input
              type="number"
              class="form-control"
              formControlName="minExperience"
              [class.is-invalid]="isFieldInvalid('minExperience')">
            <p class="field-error" *ngIf="getFieldError('minExperience', 'Minimum experience') as error">{{ error }}</p>
          </div>

          <div class="col-md-6">
            <label class="form-label">Max Experience (Years)</label>
            <input
              type="number"
              class="form-control"
              formControlName="maxExperience"
              [class.is-invalid]="isFieldInvalid('maxExperience')">
            <p class="field-error" *ngIf="getFieldError('maxExperience', 'Maximum experience') as error">{{ error }}</p>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">City</label>
            <input
              type="text"
              class="form-control"
              formControlName="city"
              [class.is-invalid]="isFieldInvalid('city')">
            <p class="field-error" *ngIf="getFieldError('city', 'City') as error">{{ error }}</p>
          </div>

          <div class="col-md-4">
            <label class="form-label">State</label>
            <input
              type="text"
              class="form-control"
              formControlName="state"
              [class.is-invalid]="isFieldInvalid('state')">
            <p class="field-error" *ngIf="getFieldError('state', 'State') as error">{{ error }}</p>
          </div>

          <div class="col-md-4">
            <label class="form-label">Country</label>
            <input
              type="text"
              class="form-control"
              formControlName="country"
              [class.is-invalid]="isFieldInvalid('country')">
            <p class="field-error" *ngIf="getFieldError('country', 'Country') as error">{{ error }}</p>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Key Skills</label>
          <input
            type="text"
            class="form-control"
            formControlName="keySkills"
            [class.is-invalid]="isFieldInvalid('keySkills')">
          <p class="field-error" *ngIf="getFieldError('keySkills', 'Key skills') as error">{{ error }}</p>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label">Education</label>
            <input
              type="text"
              class="form-control"
              formControlName="education"
              [class.is-invalid]="isFieldInvalid('education')">
            <p class="field-error" *ngIf="getFieldError('education', 'Education') as error">{{ error }}</p>
          </div>

          <div class="col-md-6">
            <label class="form-label">Industry</label>
            <input
              type="text"
              class="form-control"
              formControlName="industry"
              [class.is-invalid]="isFieldInvalid('industry')">
            <p class="field-error" *ngIf="getFieldError('industry', 'Industry') as error">{{ error }}</p>
          </div>
        </div>

      </div>


      <!-- STEP 3 -->
      <div *ngIf="step === 3">

        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Min Salary</label>
            <input
              type="number"
              class="form-control"
              formControlName="minSalary"
              [class.is-invalid]="isFieldInvalid('minSalary')">
            <p class="field-error" *ngIf="getFieldError('minSalary', 'Minimum salary') as error">{{ error }}</p>
          </div>
          <div class="col-md-4">
            <label class="form-label">Max Salary</label>
            <input
              type="number"
              class="form-control"
              formControlName="maxSalary"
              [class.is-invalid]="isFieldInvalid('maxSalary')">
            <p class="field-error" *ngIf="getFieldError('maxSalary', 'Maximum salary') as error">{{ error }}</p>
          </div>
          <div class="col-md-4">
            <label class="form-label">Currency</label>
            <input
              type="text"
              class="form-control"
              formControlName="currency"
              [class.is-invalid]="isFieldInvalid('currency')">
            <p class="field-error" *ngIf="getFieldError('currency', 'Currency') as error">{{ error }}</p>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Salary Frequency</label>
          <select
            class="form-select"
            formControlName="salaryFrequency"
            [class.is-invalid]="isFieldInvalid('salaryFrequency')">
            <option value="Monthly">Monthly</option>
            <option value="Yearly">Yearly</option>
          </select>
          <p class="field-error" *ngIf="getFieldError('salaryFrequency', 'Salary frequency') as error">{{ error }}</p>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Number of Openings</label>
            <input
              type="number"
              class="form-control"
              formControlName="openings"
              [class.is-invalid]="isFieldInvalid('openings')">
            <p class="field-error" *ngIf="getFieldError('openings', 'Number of openings') as error">{{ error }}</p>
          </div>
          <div class="col-md-6">
            <label class="form-label">Expiry Date</label>
            <input
              type="date"
              class="form-control"
              formControlName="expiryDate"
              [class.is-invalid]="isFieldInvalid('expiryDate')">
            <p class="field-error" *ngIf="getFieldError('expiryDate', 'Expiry date') as error">{{ error }}</p>
          </div>
        </div>

      </div>

    </form>
  </div>

  <!-- FOOTER -->
  <div class="modal-footer d-flex justify-content-between">
    <button class="btn btn-outline-secondary" (click)="prevStep()" [disabled]="step === 1">
      Back
    </button>

    <button class="btn btn-primary" *ngIf="step < 3" (click)="nextStep()">
      Next
    </button>

    <button class="btn btn-success" *ngIf="step === 3" (click)="submit()">
      Post Job
    </button>
  </div>

</div>
