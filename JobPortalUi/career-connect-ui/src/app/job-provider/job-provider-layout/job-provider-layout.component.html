<div class="jp-shell">
  <header class="jp-topbar">
    <div class="brand">
      <div class="logo">CC</div>
      <div>
        <div class="brand-title">Career Connect</div>
        <div class="brand-sub">Employer Console</div>
      </div>
    </div>

    <nav class="jp-nav">
      <a
        routerLink="/job-provider"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>
      <a routerLink="/job-provider/jobs" routerLinkActive="active">
        Jobs
      </a>
      <a routerLink="/job-provider/settings" routerLinkActive="active">
        Settings
      </a>
    </nav>

    <div class="jp-actions">
      <div class="dropdown">
        <button
          class="btn btn-outline-light btn-sm dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false">
          <i class="bi bi-person-circle me-1"></i>
          Profile
        </button>

        <ul class="dropdown-menu dropdown-menu-end shadow">
          <li>
            <button class="dropdown-item" type="button" (click)="openProfile('view')">
              View Profile
            </button>
          </li>
          <li>
            <button class="dropdown-item" type="button" (click)="openProfile('edit')">
              Edit Profile
            </button>
          </li>

          <li><hr class="dropdown-divider"></li>

          <li>
            <a class="dropdown-item text-danger" (click)="logout()">
              Logout
            </a>
          </li>
        </ul>
      </div>
    </div>
  </header>

  <main class="jp-main">
    <router-outlet></router-outlet>
  </main>

  <div class="profile-modal-backdrop" *ngIf="profileModalOpen" (click)="closeProfile()"></div>
  <div class="profile-modal" *ngIf="profileModalOpen" (click)="$event.stopPropagation()">
    <div class="profile-modal-header">
      <div>
        <h5>Profile</h5>
        <p>Manage recruiter profile details in one place.</p>
      </div>
      <div class="profile-modal-actions">
        <button class="chip-btn" [class.active]="profileMode === 'view'" (click)="switchToView()">View</button>
        <button class="chip-btn" [class.active]="profileMode === 'edit'" (click)="switchToEdit()">Edit</button>
        <button class="icon-btn" (click)="closeProfile()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>
    <div class="profile-modal-body">
      <app-view-profile
        *ngIf="profileMode === 'view'"
        [embedded]="true"
        (editRequested)="switchToEdit()"></app-view-profile>
      <app-edit-profile
        *ngIf="profileMode === 'edit'"
        [embedded]="true"
        (cancelled)="switchToView()"></app-edit-profile>
    </div>
  </div>
</div>
