name: Deploy microservices to Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: RecrutingAPP
          file: RecrutingAPP/Gateway/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/gateway:${{ env.IMAGE_TAG }}

      - name: Build and push identity service image
        uses: docker/build-push-action@v6
        with:
          context: RecrutingAPP
          file: RecrutingAPP/IdendityService/IdendityService/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/identity-service:${{ env.IMAGE_TAG }}

      - name: Build and push job provider service image
        uses: docker/build-push-action@v6
        with:
          context: RecrutingAPP
          file: RecrutingAPP/JobProviderService/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/jobprovider-service:${{ env.IMAGE_TAG }}

      - name: Build and push job seeker service image
        uses: docker/build-push-action@v6
        with:
          context: RecrutingAPP
          file: RecrutingAPP/JobSeekerService/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/jobseeker-service:${{ env.IMAGE_TAG }}

      - name: Deploy identity service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "${{ secrets.WEBAPP_IDENTITY_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --docker-custom-image-name "${{ env.ACR_LOGIN_SERVER }}/identity-service:${{ env.IMAGE_TAG }}" \
              --docker-registry-server-url "https://${{ env.ACR_LOGIN_SERVER }}" \
              --docker-registry-server-user "${{ secrets.ACR_USERNAME }}" \
              --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"

            az webapp config appsettings set \
              --name "${{ secrets.WEBAPP_IDENTITY_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --settings \
                WEBSITES_PORT=8080 \
                ASPNETCORE_ENVIRONMENT=Production \
                Jwt__Key="${{ secrets.JWT_KEY }}" \
                Jwt__Issuer="${{ secrets.JWT_ISSUER }}" \
                Jwt__Audience="${{ secrets.JWT_AUDIENCE }}" \
                MongoSettings__ConnectionString="${{ secrets.MONGO_CONNECTION_STRING }}" \
                MongoSettings__DatabaseName="${{ secrets.MONGO_IDENTITY_DB }}" \
                EmailSettings__From="${{ secrets.EMAIL_FROM }}" \
                Messaging__Provider=AzureServiceBus \
                Messaging__AzureServiceBus__ConnectionString="${{ secrets.SERVICEBUS_CONNECTION_STRING }}" \
                Messaging__AzureServiceBus__IdentityTopic="${{ secrets.SERVICEBUS_IDENTITY_TOPIC }}"

      - name: Deploy job provider service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "${{ secrets.WEBAPP_JOBPROVIDER_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --docker-custom-image-name "${{ env.ACR_LOGIN_SERVER }}/jobprovider-service:${{ env.IMAGE_TAG }}" \
              --docker-registry-server-url "https://${{ env.ACR_LOGIN_SERVER }}" \
              --docker-registry-server-user "${{ secrets.ACR_USERNAME }}" \
              --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"

            az webapp config appsettings set \
              --name "${{ secrets.WEBAPP_JOBPROVIDER_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --settings \
                WEBSITES_PORT=8080 \
                ASPNETCORE_ENVIRONMENT=Production \
                Jwt__Key="${{ secrets.JWT_KEY }}" \
                Jwt__Issuer="${{ secrets.JWT_ISSUER }}" \
                Jwt__Audience="${{ secrets.JWT_AUDIENCE }}" \
                Mongo__ConnectionString="${{ secrets.MONGO_CONNECTION_STRING }}" \
                Mongo__Database="${{ secrets.MONGO_JOBPROVIDER_DB }}" \
                Messaging__Provider=AzureServiceBus \
                Messaging__AzureServiceBus__ConnectionString="${{ secrets.SERVICEBUS_CONNECTION_STRING }}" \
                Messaging__AzureServiceBus__Topic="${{ secrets.SERVICEBUS_JOBPROVIDER_TOPIC }}" \
                Messaging__AzureServiceBus__JobApplicationsTopic="${{ secrets.SERVICEBUS_JOBAPPLICATIONS_TOPIC }}" \
                Messaging__AzureServiceBus__JobProviderSubscription="${{ secrets.SERVICEBUS_JOBPROVIDER_SUBSCRIPTION }}"

      - name: Deploy job seeker service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "${{ secrets.WEBAPP_JOBSEEKER_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --docker-custom-image-name "${{ env.ACR_LOGIN_SERVER }}/jobseeker-service:${{ env.IMAGE_TAG }}" \
              --docker-registry-server-url "https://${{ env.ACR_LOGIN_SERVER }}" \
              --docker-registry-server-user "${{ secrets.ACR_USERNAME }}" \
              --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"

            az webapp config appsettings set \
              --name "${{ secrets.WEBAPP_JOBSEEKER_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --settings \
                WEBSITES_PORT=8080 \
                ASPNETCORE_ENVIRONMENT=Production \
                Jwt__Key="${{ secrets.JWT_KEY }}" \
                Jwt__Issuer="${{ secrets.JWT_ISSUER }}" \
                Jwt__Audience="${{ secrets.JWT_AUDIENCE }}" \
                Mongo__ConnectionString="${{ secrets.MONGO_CONNECTION_STRING }}" \
                Mongo__DatabaseName="${{ secrets.MONGO_JOBSEEKER_DB }}" \
                Messaging__Provider=AzureServiceBus \
                Messaging__AzureServiceBus__ConnectionString="${{ secrets.SERVICEBUS_CONNECTION_STRING }}" \
                Messaging__AzureServiceBus__JobApplicationsTopic="${{ secrets.SERVICEBUS_JOBAPPLICATIONS_TOPIC }}" \
                Messaging__AzureServiceBus__JobEventsTopic="${{ secrets.SERVICEBUS_JOBEVENTS_TOPIC }}" \
                Messaging__AzureServiceBus__IdentityTopic="${{ secrets.SERVICEBUS_IDENTITY_TOPIC }}" \
                Messaging__AzureServiceBus__JobSeekerSubscription="${{ secrets.SERVICEBUS_JOBSEEKER_SUBSCRIPTION }}" \
                Messaging__AzureServiceBus__JobEventsSubscription="${{ secrets.SERVICEBUS_JOBEVENTS_SUBSCRIPTION }}"

      - name: Deploy gateway
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "${{ secrets.WEBAPP_GATEWAY_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --docker-custom-image-name "${{ env.ACR_LOGIN_SERVER }}/gateway:${{ env.IMAGE_TAG }}" \
              --docker-registry-server-url "https://${{ env.ACR_LOGIN_SERVER }}" \
              --docker-registry-server-user "${{ secrets.ACR_USERNAME }}" \
              --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"

            az webapp config appsettings set \
              --name "${{ secrets.WEBAPP_GATEWAY_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --settings \
                WEBSITES_PORT=8080 \
                ASPNETCORE_ENVIRONMENT=Production \
                Jwt__Key="${{ secrets.JWT_KEY }}" \
                Jwt__Issuer="${{ secrets.JWT_ISSUER }}" \
                Jwt__Audience="${{ secrets.JWT_AUDIENCE }}" \
                Ocelot__Routes__0__DownstreamScheme="${{ secrets.GATEWAY_DOWNSTREAM_SCHEME }}" \
                Ocelot__Routes__0__DownstreamHostAndPorts__0__Host="${{ secrets.IDENTITY_HOST }}" \
                Ocelot__Routes__0__DownstreamHostAndPorts__0__Port="${{ secrets.IDENTITY_PORT }}" \
                Ocelot__Routes__1__DownstreamScheme="${{ secrets.GATEWAY_DOWNSTREAM_SCHEME }}" \
                Ocelot__Routes__1__DownstreamHostAndPorts__0__Host="${{ secrets.IDENTITY_HOST }}" \
                Ocelot__Routes__1__DownstreamHostAndPorts__0__Port="${{ secrets.IDENTITY_PORT }}" \
                Ocelot__Routes__2__DownstreamScheme="${{ secrets.GATEWAY_DOWNSTREAM_SCHEME }}" \
                Ocelot__Routes__2__DownstreamHostAndPorts__0__Host="${{ secrets.JOBPROVIDER_HOST }}" \
                Ocelot__Routes__2__DownstreamHostAndPorts__0__Port="${{ secrets.JOBPROVIDER_PORT }}" \
                Ocelot__Routes__3__DownstreamScheme="${{ secrets.GATEWAY_DOWNSTREAM_SCHEME }}" \
                Ocelot__Routes__3__DownstreamHostAndPorts__0__Host="${{ secrets.JOBSEEKER_HOST }}" \
                Ocelot__Routes__3__DownstreamHostAndPorts__0__Port="${{ secrets.JOBSEEKER_PORT }}" \
                Ocelot__GlobalConfiguration__BaseUrl="${{ secrets.GATEWAY_BASE_URL }}"
